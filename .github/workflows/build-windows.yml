name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'main.py'
      - 'config.py'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt5 requests

      - name: Generate config.py
        shell: python
        env:
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
        run: |
          import os
          key = os.environ["DOUBAO_API_KEY"]
          with open("config.py", "w", encoding="utf-8") as f:
              f.write(f"DOUBAO_API_KEY = {key!r}\n")
              f.write('DOUBAO_API_URL = "https://ark.cn-beijing.volces.com/api/v3/images/generations"\n')
              f.write('DOUBAO_MODEL = "doubao-seedream-4-5-251128"\n')
              f.write("IMAGE_WIDTH = 2048\n")
              f.write("IMAGE_HEIGHT = 2048\n")
              f.write("IMAGE_COUNT = 1\n")

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --windowed --onefile --name "服装AI创作画布" --add-data "config.py;." main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuzhuang-ai-canvas-windows
          path: dist/*.exe
          if-no-files-found: error
